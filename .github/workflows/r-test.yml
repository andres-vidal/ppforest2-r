name: Run R Tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  Ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::vdiffr
      - run: make test
  Mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # CRAN's macOS binaries rather than Posit Package Manager's: Posit's gower
      # binary links against a libomp.dylib that the CRAN build of R does not
      # ship, so gower, and with it tune, cannot be loaded.
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: false
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::vdiffr
      - run: make test
  Windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::vdiffr
      - run: make test
