name: Run R Package Check (CRAN)
on:
  pull_request:
  push:
    branches: [main]
env:
  # Mirror CRAN's incoming checks more closely than a default R CMD check.
  _R_CHECK_FORCE_SUGGESTS_: true         # fail if a Suggests package is missing (complete check)
  _R_CHECK_CRAN_INCOMING_REMOTE_: true   # validate URLs/DOIs in DESCRIPTION against the network
  _R_CHECK_TIMINGS_: 10                  # flag examples/tests slower than 10s
jobs:
  Ubuntu:
    name: Ubuntu (R ${{ matrix.r }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        r: [release, oldrel-1, devel]
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
      - uses: r-lib/actions/setup-tinytex@v2
      - name: Install system dependencies for CRAN check
        run: sudo apt-get install -y --no-install-recommends devscripts qpdf
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools
      - run: make check-cran
      - name: Show Install Logs
        if: failure()
        run: cat ppforest2.Rcheck/00install.out
  Mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # CRAN's macOS binaries rather than Posit Package Manager's: Posit's gower
      # binary links against a libomp.dylib that the CRAN build of R does not
      # ship, so gower, and with it tune, cannot be loaded.
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: false
      - uses: r-lib/actions/setup-tinytex@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools
      - run: make check-cran
      - name: Show Install Logs
        if: failure()
        run: cat ppforest2.Rcheck/00install.out
  MacOpenMP:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # CRAN's macOS binaries, as in the Mac job.
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: false
      - uses: r-lib/actions/setup-tinytex@v2
      - run: brew install libomp
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools
      - run: make check-cran
      - name: Show Install Logs
        if: failure()
        run: cat ppforest2.Rcheck/00install.out
  Windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-tinytex@v2
        env:
          TINYTEX_INSTALLER: TinyTeX
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools
      - run: make check-cran
      - name: Show Install Logs
        if: failure()
        run: cat ppforest2.Rcheck/00install.out
